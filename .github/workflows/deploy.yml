name: CICD for deploy project on vercel

on:
    push:
        branches:
            - master



jobs:
    deploy:
        runs-on: ubuntu-latest
        

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v2

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: 18

            - name: Install Dependencies
              run: npm install


            - name: Build Project
              run: npm run build 

            - name: Deploy to Vercel
              run: npx vercel --prod --token ${{ secrets.SKYLAB_REACT }}